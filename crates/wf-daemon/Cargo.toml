[package]
name = "wf-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wf-core.workspace = true
wf-store.workspace = true
wf-net.workspace = true
wf-vcs.workspace = true
wf-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
tracing.workspace = true
humantime.workspace = true
data-encoding.workspace = true
rand.workspace = true
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
shellexpand = { version = "3.1.2", default-features = false, features = ["base-0"] }
bytesize = { version = "2.7.0", features = ["serde"] }
walkdir = "2.5.0"

[dev-dependencies]
wf-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
globset = "0.4.20"
