[assignment]
mode = "dispatch"
fallback = "optimistic"
lease = "30m"

[lanes.default]
claim = ["member"]

[lanes.meta]
claim = ["member"]
types = ["distill"]

# Holds no items: its agents answer and escalate blockers.
[lanes.supervision]
claim = ["member"]

[merge]
mode = "local"
target = "main"

[[review]]
name = "none"
steps = []

[[review]]
name = "light"
steps = [{ agent = { requires = ["review"] } }]

[[review]]
name = "standard"
steps = [{ agent = { requires = ["review", "strong-model"] } }]

[[review]]
name = "critical"
steps = [{ agent = { requires = ["review", "strong-model"] } }, "principal"]

[[review]]
name = "manual"
steps = ["principal"]

# What happens when a session ends without finishing: one step per unsuccessful attempt.
[[recovery]]
name = "none"
steps = ["principal"]

[[recovery]]
name = "standard"
steps = ["retry", "retry", "principal"]

# A reviewer says what went wrong before the one retry.
[[recovery]]
name = "diagnose"
steps = [{ agent = { requires = ["review"] } }, "retry", "principal"]

[types.task]
review = "manual"
recovery = "standard"
lane = "default"
fields = ["priority", "labels", "requires"]
depends_on = ["task", "decision"]
initial = "open"
transitions = "any"
states = [
  { name = "backlog", category = "inactive" },
  { name = "open", category = "open" },
  { name = "in_progress", category = "active" },
  { name = "in_review", category = "review" },
  { name = "done", category = "done" },
  { name = "dropped", category = "cancelled" },
]

[types.decision]
lane = "default"
fields = ["labels"]
depends_on = []
initial = "proposed"
transitions = "any"
states = [
  { name = "proposed", category = "review" },
  { name = "ratified", category = "done" },
  { name = "rejected", category = "cancelled" },
  { name = "superseded", category = "done" },
]

[types.distill]
lane = "meta"
recovery = "standard"
fields = ["labels"]
depends_on = []
initial = "open"
transitions = "any"
states = [
  { name = "open", category = "open" },
  { name = "in_progress", category = "active" },
  { name = "done", category = "done" },
]
