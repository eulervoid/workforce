[assignment]
mode = "dispatch"
fallback = "optimistic"
lease = "30m"

[lanes.default]
claim = ["member"]

[lanes.meta]
claim = ["member"]
types = ["distill"]

[lanes.supervision]
claim = ["member"]
types = ["question"]

[merge]
mode = "local"
target = "main"

[[review]]
name = "human"
steps = ["human"]

[[review]]
name = "light"
steps = [{ agent = { requires = ["review"] } }]

[[review]]
name = "standard"
steps = [{ agent = { requires = ["review", "strong-model"] } }]

[[review]]
name = "critical"
steps = [{ agent = { requires = ["review", "strong-model"] } }, "human"]

[types.task]
review = "human"
lane = "default"
fields = ["priority", "labels", "requires"]
depends_on = ["task", "question", "decision"]
initial = "open"
transitions = "any"
states = [
  { name = "backlog", category = "inactive" },
  { name = "open", category = "open" },
  { name = "in_progress", category = "active" },
  { name = "in_review", category = "blocked" },
  { name = "done", category = "done" },
  { name = "dropped", category = "cancelled" },
]

[types.question]
lane = "supervision"
fields = ["priority", "labels"]
depends_on = []
initial = "open"
transitions = "any"
states = [
  { name = "open", category = "open" },
  { name = "needs_human", category = "blocked" },
  { name = "answered", category = "done" },
  { name = "dropped", category = "cancelled" },
]

[types.decision]
lane = "default"
fields = ["labels"]
depends_on = []
initial = "proposed"
transitions = "any"
states = [
  { name = "proposed", category = "blocked" },
  { name = "ratified", category = "done" },
  { name = "rejected", category = "cancelled" },
  { name = "superseded", category = "done" },
]

[types.distill]
lane = "meta"
fields = ["labels"]
depends_on = []
initial = "open"
transitions = "any"
states = [
  { name = "open", category = "open" },
  { name = "in_progress", category = "active" },
  { name = "done", category = "done" },
]
