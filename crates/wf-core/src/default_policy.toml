[lanes.default]

[lanes.meta]

# Holds no items: its agents answer and escalate blockers.
[lanes.supervision]

[merge]
mode = "local"
target = "main"

[[review]]
name = "none"
steps = []

[[review]]
name = "light"
steps = [{ agent = { requires = ["review"] } }]

[[review]]
name = "standard"
steps = [{ agent = { requires = ["review", "strong-model"] } }]

[[review]]
name = "critical"
steps = [{ agent = { requires = ["review", "strong-model"] } }, "principal"]

[[review]]
name = "manual"
steps = ["principal"]

# What happens when a session ends without finishing: one step per unsuccessful attempt.
[[recovery]]
name = "none"
steps = ["principal"]

[[recovery]]
name = "standard"
steps = ["retry", "retry", "principal"]

# A reviewer says what went wrong before the one retry.
[[recovery]]
name = "diagnose"
steps = [{ agent = { requires = ["review"] } }, "retry", "principal"]

# A type lists the states it uses, from draft, open, active, review, done and cancelled, and the
# one its items start in. `wf item add --draft` starts an item as a draft instead.
[types.task]
review = "manual"
recovery = "standard"
lane = "default"
fields = ["priority", "labels", "requires"]
depends_on = ["task", "decision"]
initial = "open"
states = ["draft", "open", "active", "review", "done", "cancelled"]

[types.decision]
lane = "default"
fields = ["labels"]
depends_on = []
initial = "review"
states = ["review", "done", "cancelled"]

[types.distill]
lane = "meta"
recovery = "standard"
fields = ["labels"]
depends_on = []
initial = "open"
states = ["open", "active", "done", "cancelled"]
