[package]
name = "wf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wf_cli"
path = "src/lib.rs"

[[bin]]
name = "wf"
path = "src/main.rs"

[dependencies]
wf-core.workspace = true
wf-store.workspace = true
anyhow.workspace = true
clap.workspace = true
data-encoding.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tempfile.workspace = true
toml.workspace = true

[dev-dependencies]
wf-core = { workspace = true, features = ["testing"] }
insta = { version = "1", features = ["json"] }
