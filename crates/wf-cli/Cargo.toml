[package]
name = "wf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wf_cli"
path = "src/lib.rs"

[[bin]]
name = "wf"
path = "src/main.rs"

[dependencies]
wf-core.workspace = true
wf-store.workspace = true
wf-net.workspace = true
wf-daemon.workspace = true
wf-harness.workspace = true
anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
data-encoding.workspace = true
humantime.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
terminal_size = "0.4.4"
nucleo-picker = "0.12"
anstyle = "1.0.14"
anstream = "1.0.0"

[dev-dependencies]
wf-core = { workspace = true, features = ["testing"] }
wf-net.workspace = true
insta = { version = "1", features = ["json"] }
