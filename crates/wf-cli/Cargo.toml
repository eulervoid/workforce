[package]
name = "wf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wf_cli"
path = "src/lib.rs"

[[bin]]
name = "wf"
path = "src/main.rs"

[lints]
workspace = true

# The fake agent of the harness' tests, which the tests of the sessions run too.
[[example]]
name = "fake-acp-agent"
path = "../wf-harness/src/bin/fake-acp-agent.rs"

[dependencies]
wf-core.workspace = true
wf-store.workspace = true
wf-net.workspace = true
wf-daemon.workspace = true
wf-harness.workspace = true
wf-vcs.workspace = true
anyhow.workspace = true
clap.workspace = true
comfy-table.workspace = true
data-encoding.workspace = true
humantime.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustix = { version = "1", features = ["process", "system"] }
terminal_size = "0.4.4"
nucleo-picker = "0.12"
anstyle.workspace = true
anstream = "1.0.0"
pulldown-cmark.workspace = true
rand.workspace = true
similar = "3.2"
textwrap = "0.16"
strsim = "0.11"
cliclack = "0.5"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# Only for its `anstyle` feature: ratatui styles from the theme's `anstyle` styles.
ratatui-core = { version = "0.1", features = ["anstyle"] }
ansi-to-tui = "8"
tui-input = "0.15"
bytesize.workspace = true

[dev-dependencies]
wf-core = { workspace = true, features = ["testing"] }
wf-vcs = { workspace = true, features = ["testing"] }
insta = { version = "1", features = ["json"] }
