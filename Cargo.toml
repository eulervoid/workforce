[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
wf-core = { path = "crates/wf-core" }
wf-store = { path = "crates/wf-store" }
wf-net = { path = "crates/wf-net" }
wf-daemon = { path = "crates/wf-daemon" }
wf-harness = { path = "crates/wf-harness" }
wf-vcs = { path = "crates/wf-vcs" }
anstyle = "1.0.14"
anyhow = "1"
blake3 = "1"
bytesize = "2.7.0"
close_fds = "0.3"
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "8", features = ["custom_styling"] }
iroh = "1.3"
iroh-gossip = "0.101"
n0-future = "0.3"
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
jiff = { version = "0.2", features = ["serde"] }
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
rand = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "0.6.7", features = ["ed25519", "std"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time", "net"] }
data-encoding = "2"
humantime = "2"
humantime-serde = "1"
tracing = "0.1"

[profile.dev]
# Line tables keep backtraces with file and line, at about half the size of a target directory.
debug = "line-tables-only"

[workspace.lints.clippy]
# A new variant of an enum we own must fail to compile where it needs handling. Matches on
# enums of other crates carry an `#[expect]` saying why a wildcard is right there.
wildcard_enum_match_arm = "warn"

# A copy of an upstream crate with one change; vendor/README.md says which and why.
[patch.crates-io]
netwatch = { path = "vendor/netwatch" }
