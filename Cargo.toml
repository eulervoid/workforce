[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wf-core = { path = "crates/wf-core" }
wf-store = { path = "crates/wf-store" }
wf-net = { path = "crates/wf-net" }
wf-daemon = { path = "crates/wf-daemon" }
wf-harness = { path = "crates/wf-harness" }
wf-vcs = { path = "crates/wf-vcs" }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "8", features = ["custom_styling"] }
iroh = "1.3"
iroh-gossip = "0.101"
n0-future = "0.3"
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
jiff = "0.2"
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
rand = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time", "net"] }
data-encoding = "2"
humantime = "2"
tracing = "0.1"
