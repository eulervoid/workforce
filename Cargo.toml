[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wf-core = { path = "crates/wf-core" }
wf-store = { path = "crates/wf-store" }
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
jiff = "0.2"
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
data-encoding = "2"
